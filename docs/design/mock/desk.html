<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The desk</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400..700&family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- The desk: the single mock of the UI. Flow from p2r2-b (receipt, shockwave, count, verdict, couriers, review); rims from P1-B with one tint;
     the glance file (R36) from b8 part 6; the resources sheet from P3 round 1 A. Self-contained: needs only ../eras/*.json, Motion and Google Fonts. -->
<script src="https://cdn.jsdelivr.net/npm/motion@13.4.2/dist/motion.js"></script>
<script>
/* P2 feel set core: the desk, the two worlds, the priced act, and the tools the three options animate with. */
window.P2=(()=>{
const Q=new URLSearchParams(location.search),WID=Q.get('world')==='westeros'?'westeros':'biden-2021';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
class Stale extends Error{}
const P={WID,$,$$,Stale,rm:matchMedia('(prefers-reduced-motion: reduce)').matches||Q.has('rm'),outcome:Q.get('out')==='fail'?'fail':'pass',run:0,priced:false,busy:false};
const M='−';P.fmt=d=>(d>0?'+':d<0?M:'')+Math.abs(d);
P.ic=(id,c='')=>`<svg class="ic ${c}" aria-hidden="true"><use href="#${id}"/></svg>`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const hx=h=>{h=h.replace('#','');if(h.length===3)h=[...h].map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const mix=(a,b,p)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,'0')).join('')};

/* the act on the desk in each world: what it spends when signed, what lands if it passes, what it costs if it fails */
const SC={
'biden-2021':{act:{icon:'i-cap',text:'Send $1,400 checks and extend jobless aid through the summer.',title:'The rescue bill'},
 now:{authority:-1},
 pass:{res:{treasury:-14,authority:3},sup:{congress:4,public:5,dem:4,fed:-5,gop:-5,markets:-3}},
 fail:{res:{authority:-4},sup:{dem:-4,public:-2}},
 vetoes:[{id:'congress',name:'The Senate',rule:'50 of 100 votes; your Vice President breaks a tie'}],
 house:{label:'The Senate',unit:'votes',need:50,tie:'Your Vice President',
  fac:[{id:'dem',name:'Democrats',n:48,c:['#2553a3','#7aa2ff'],why:'Backs relief checks and aid for states and cities',hes:['Joe Manchin','Kyrsten Sinema'],hesWhy:'Joe Manchin wants it smaller'},
   {id:'ind',name:'Independents',n:2,c:['#596073','#aab1c2'],why:'Votes with your side'},
   {id:'gop',name:'Republicans',n:50,c:['#bf2f2b','#ff7a70'],against:true,why:'Fights new spending without cuts',hes:['Susan Collins'],hesWhy:'Susan Collins wants it cut down'}],
  draw:{pass:{gop:[0],dem:[1,1]},fail:{gop:[0],dem:[1,0]}}},
 paper:'The Capitol Ledger',
 head:{pass:'The Senate passes the rescue, 51 to 50',fail:'The rescue falls in the Senate, 49 to 51'},
 deck:{pass:'Your Vice President breaks the tie. Checks go out within the month.',fail:'Joe Manchin holds; Kyrsten Sinema votes no. The bill goes back to committee.'}},
'westeros':{act:{icon:'i-army',text:'Call the banners to clear the kingsroad of outlaws.',title:'The kingsroad levy'},
 now:{authority:-2},
 pass:{res:{treasury:-6,authority:5},sup:{smallfolk:8,council:3,baratheon:2,houses:-2,ironbank:-3}},
 fail:{res:{authority:-5},sup:{baratheon:-3,smallfolk:-3}},
 vetoes:[{id:'houses',name:'The great houses',rule:'15 of their 30 voices, or no lord marches'}],
 house:{label:'Voices at court',unit:'voices',need:50,veto:{fac:'houses',need:15},
  fac:[{id:'baratheon',name:'House Baratheon',n:20,c:['#7a5d0e','#e3c15a'],why:"Backs the king's peace"},
   {id:'smallfolk',name:'Smallfolk',n:15,c:['#6b4f33','#caa27a'],why:'Backs safe roads'},
   {id:'council',name:'Small council',n:15,c:['#3f5163','#9fb4c8'],why:'Wants order on the roads'},
   {id:'houses',name:'Great houses',n:30,c:['#44584c','#a9c2b0'],why:'',hes:['House Stark','House Arryn','House Tully','House Tyrell','House Martell','House Greyjoy'],hesWhy:'Fights calling the banners for a war they did not choose'},
   {id:'lannister',name:'House Lannister',n:20,c:['#9b2226','#ff8a80'],against:true,why:"Holds out for the Hand's chain"}],
  draw:{pass:{houses:[5,5,5,3,0,0]},fail:{houses:[5,0,4,0,0,0]}}},
 paper:'The Crier of King’s Landing',
 head:{pass:'The lords ride: the banners are called',fail:'The great houses refuse the King'},
 deck:{pass:'Stark, Arryn and Tully march first. The kingsroad will be cleared by the next moon.',fail:'Only Stark and Tully answer the raven. The banners stay home.'}}};
const S0=SC[WID];P.SC=S0;

let W,V,RES,HOME,ABROAD,H;
const RIC={bank:'i-tre',gavel:'i-aut',note:'i-che',coins:'i-coins',crown:'i-crown',crate:'i-crate'};
const HIC={chamber:'i-cap',court:'i-court',army:'i-army',clergy:'i-clergy',street:'i-pop',party:'i-flag',patrons:'i-coins',press:'i-news',foreign:'i-globe',market:'i-chart',crown:'i-crown',council:'i-council'};
const RC={treasury:'tre',authority:'aut',chest:'che'};P.RC=RC;P.RIC=RIC;P.HIC=HIC;

/* theme v2 from the world file: palette in both modes, type, material, radius; the texture is a quiet hatch */
function theme(){const t=W.theme,d=t.dark||{};
 const pal=(c,m)=>`--paper:${c.paper};--card:${c.surface};--ink:${c.ink};--ink-2:${c.muted};--rule:${c.rule};--tone:${mix(c.ink,c.paper,m?.9:.92)};--accent:${c.accent};--navy:${c.accent2};--sh:${m?'rgba(0,0,0,.55)':c.ink+'38'}`;
 const fam=[t.display,t.body,t.mono].filter(Boolean);
 const l=document.createElement('link');l.rel='stylesheet';
 l.href='https://fonts.googleapis.com/css2?'+fam.map(f=>'family='+f.replace(/ /g,'+')+(f===t.display?'':':wght@400;500;600;700')).join('&')+'&display=swap';document.head.appendChild(l);
 const num=/IM Fell| SC$|Unifraktur/.test(t.display)?`"${t.body}"`:`"${t.display}"`;
 const st=document.createElement('style');st.textContent=`:root{--k:1;${pal(t,0)};--disp:"${t.display}",Georgia,serif;--ui:"${t.body}",system-ui,sans-serif;--mono:${t.mono?`"${t.mono}",`:`"${t.body}",`}ui-monospace,monospace;--numf:${num},Georgia,serif;--r:${t.radius??6}px;--tex:${t.textureScale||1}}
:root[data-theme=dark]{${pal({paper:d.paper,surface:d.surface,ink:d.ink,muted:d.muted,accent:d.accent,accent2:d.accent2,rule:d.rule},1)}}`;document.head.appendChild(st);
 document.body.dataset.material=t.material;P.k={stately:1.18,brisk:.9,mechanical:1,fluid:1}[t.motion]||1}
function setTheme(m){document.documentElement.dataset.theme=m;try{localStorage.setItem('sp-theme',m)}catch(e){}$('#r-theme').textContent=m==='dark'?'Light':'Dark';$$('[data-cl]').forEach(s=>s.style.setProperty('--pc',s.dataset[m==='dark'?'cd':'cl']))}
P.dark=()=>document.documentElement.dataset.theme==='dark';

/* the chamber as 100 seats in six rows; factions fill wedges left to right, hesitant seats sit at their edge nearest the centre */
function seatsLayout(){const R=[.45,.56,.67,.78,.89,1],tot=R.reduce((a,b)=>a+b),n=R.map(r=>Math.round(100*r/tot));n[5]+=100-n.reduce((a,b)=>a+b);
 const out=[];R.forEach((r,ri)=>{for(let j=0;j<n[ri];j++){const th=Math.PI*(1-j/(n[ri]-1));out.push({x:r*Math.cos(th),y:-r*Math.sin(th),th,ri})}});
 out.sort((a,b)=>b.th-a.th||a.ri-b.ri);return out}
function buildSeats(){const L=seatsLayout();let i=0;P.seats=[];
 for(const f of H.fac){const hs=f.hes?f.hes.length:0,per=hs?(f.id==='houses'?5:1):0,nh=hs*per,idx=[];for(let k=0;k<f.n;k++)idx.push(i+k);
  const hesIdx=f.against?idx.slice(0,nh):idx.slice(f.n-nh);
  idx.forEach(j=>{const h=hesIdx.indexOf(j);P.seats.push({...L[j],i:j,fac:f,pre:h>=0?'hes':f.against?'ag':'for',who:h>=0?f.hes[Math.floor(h/per)]:null,hk:h>=0?Math.floor(h/per):-1,hj:h})});i+=f.n}}
P.preview=()=>{const c={for:0,ag:0,hes:0,need:H.need,unit:H.unit};P.seats.forEach(s=>c[s.pre]++);return c};
/* the roll call: fixed votes in a seeded shuffle, then the hesitant ones last, one name at a time */
P.rollCall=out=>{let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 const fixed=P.seats.filter(s=>s.pre!=='hes').map(s=>({s,v:s.pre==='for'?1:0,k:rnd()})).sort((a,b)=>a.k-b.k);
 const hes=[];H.fac.forEach(f=>{if(!f.hes)return;const d=H.draw[out][f.id];f.hes.forEach((who,k)=>{const ss=P.seats.filter(s=>s.fac===f&&s.hk===k);ss.forEach((s,j)=>hes.push({s,v:j<d[k]?1:0,who,group:k,fac:f}))})});
 const order=Object.keys(H.draw[out]).flatMap(id=>hes.filter(h=>h.fac.id===id));
 const all=[...fixed,...order],yes=all.filter(x=>x.v).length,no=all.length-yes;
 let vetoYes=null,vetoOK=true;if(H.veto){vetoYes=all.filter(x=>x.v&&x.s.fac.id===H.veto.fac).length;vetoOK=vetoYes>=H.veto.need}
 const tie=yes===no&&!!H.tie,pass=vetoOK&&yes>=H.need&&(yes>no||tie);
 const fy=yes+(tie?1:0);return{fixed,hes:order,yes,no,tie,pass,vetoYes,score:`${fy} to ${no}`,fy}};
P.seatXY=s=>{const svg=$('#hemi'),m=svg.getScreenCTM();return{x:m.a*s.x+m.c*s.y+m.e,y:m.b*s.x+m.d*s.y+m.f,k:m.a}};
P.seatCls=(s,c)=>{s.el.setAttribute('class','seat '+c)};

/* state: resources and one support number per group; the final vote is support times weight over the groups that vote */
function freshState(){P.S={res:{},sup:{}};for(const k of RES)P.S.res[k]=W.ledgers[k].start;for(const h of W.holders)P.S.sup[h.id]=Math.round(h.stance*100)}
P.fv=(sup=P.S.sup)=>Math.round(W.holders.reduce((a,h)=>a+(h.weight||0)*sup[h.id],0));
const hName=id=>{const h=W.holders.find(x=>x.id===id);return h.short||h.name};
P.items=which=>{const o=which==='now'?{res:S0.now,sup:{}}:S0[which],L=[];
 for(const[k,d]of Object.entries(o.res))L.push({kind:'res',id:k,name:W.ledgers[k].name,d,icon:RIC[W.ledgers[k].icon]||'i-tre',c:`var(--${RC[k]})`,el:$(`.led[data-r=${k}]`)});
 for(const[id,d]of Object.entries(o.sup||{}))L.push({kind:'sup',id,name:hName(id),d,icon:HIC[W.holders.find(h=>h.id===id).icon]||'i-flag',c:d>0?'var(--up)':'var(--dn)',el:$(`.hm[data-h=${id}]`)});
 L.forEach(it=>{it.num=$('.n',it.el);it.from=it.kind==='res'?P.S.res[it.id]:P.S.sup[it.id];it.to=clamp(it.from+it.d,0,100)});return L};
P.lines=()=>({now:P.items('now'),pass:P.items('pass'),fail:P.items('fail'),vetoes:S0.vetoes.map(v=>({...v,el:$(`.hm[data-h=${v.id}]`)})),fac:H.fac.map(f=>{const ss=P.seats.filter(s=>s.fac===f);return{...f,for:ss.filter(s=>s.pre==='for').length,ag:ss.filter(s=>s.pre==='ag').length,hs:ss.filter(s=>s.pre==='hes').length}}),count:P.preview()});
/* commit one change: the number rolls, the bar moves, the warn state follows the line */
P.land=(it,ms=650)=>{if(it.kind==='res')P.S.res[it.id]=it.to;else P.S.sup[it.id]=it.to;
 const bar=$('.bar>i',it.el);if(bar)bar.style.width=it.to+'%';
 if(it.kind==='sup'){const h=W.holders.find(x=>x.id===it.id);it.el.classList.toggle('warn',it.to<h.line)}
 if(it.kind==='sup')P.rowPaint?.(it.id);else P.resPaint?.(it);
 return P.roll(it.num,it.from,it.to,ms)};
P.landFv=(ms=900)=>{const el=$('#fv'),from=+$('#fv .n').textContent,to=P.fv();el.classList.toggle('over',to>=50);el.classList.toggle('under',to<50);$('#fv .bar>i').style.width=to+'%';return{from,to,p:P.roll($('#fv .n'),from,to,ms)}};

P.roll=(el,from,to,ms=600)=>new Promise(res=>{if(P.rm||ms<=0||from===to){el.textContent=to;return res()}const t0=performance.now();
 const f=t=>{const p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);el.textContent=Math.round(from+(to-from)*e);p<1?requestAnimationFrame(f):res()};requestAnimationFrame(f)});
P.sleep=ms=>{const r=P.run;return new Promise((res,rej)=>setTimeout(()=>r===P.run?res():rej(new Stale()),ms*(P.rm?.4:P.k)))};
P.a=async(el,kf,o={})=>{const r=P.run;if(P.rm&&!o.keep)o={...o,duration:Math.min(o.duration??.3,.18),type:undefined,delay:0};await Motion.animate(el,kf,o);if(r!==P.run)throw new Stale()};
P.at=el=>{const b=el.getBoundingClientRect();return{x:b.left+b.width/2,y:b.top+b.height/2,b}};

/* shake: decaying noise on the whole desk (Vlambeer), never on the numbers alone */
P.shake=(amp=8,ms=380,dir=null,el=$('#dk'))=>{if(P.rm)return Promise.resolve();return new Promise(res=>{const t0=performance.now();
 const f=t=>{const p=(t-t0)/ms;if(p>=1){el.style.transform='';return res()}const a=amp*(1-p)*(1-p),x=dir?dir[0]*a*Math.cos(p*28):(Math.random()*2-1)*a,y=dir?dir[1]*a*Math.cos(p*28):(Math.random()*2-1)*a;
 el.style.transform=`translate3d(${x.toFixed(2)}px,${y.toFixed(2)}px,0)`;requestAnimationFrame(f)};requestAnimationFrame(f)})};

/* the FX layer: one canvas over the desk; items step and draw until they return false */
const FX={items:[],on:false,cv:null,cx:null,dpr:1,
 size(){this.dpr=Math.min(2,devicePixelRatio||1);this.cv.width=innerWidth*this.dpr;this.cv.height=innerHeight*this.dpr},
 add(o){if(P.rm&&!o.rmOK)return;this.items.push(o);if(!this.on){this.on=true;this.last=performance.now();requestAnimationFrame(t=>this.tick(t))}},
 tick(t){const dt=Math.min(.05,(t-this.last)/1000);this.last=t;const c=this.cx;c.setTransform(this.dpr,0,0,this.dpr,0,0);c.clearRect(0,0,innerWidth,innerHeight);
  this.items=this.items.filter(o=>o.step(dt,c,t)!==false);if(this.items.length)requestAnimationFrame(t=>this.tick(t));else{this.on=false;c.clearRect(0,0,innerWidth,innerHeight)}},
 clear(){this.items=[]}};
P.FX=FX;P.cx=()=>FX.cx;
P.css=v=>getComputedStyle(document.body).getPropertyValue(v).trim();
/* particles: dots, shards, paper flecks; gravity and drag per burst */
P.burst=(x,y,o={})=>{const n=o.n||24,ps=[];for(let i=0;i<n;i++){const a=(o.dir??0)+(o.spread??Math.PI*2)*(Math.random()-.5),sp=(o.speed||260)*(.35+Math.random()*.9);
 ps.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:(o.life||.9)*(.6+Math.random()*.6),age:0,s:(o.size||4)*(.5+Math.random()),c:o.colors[i%o.colors.length],r:Math.random()*6,vr:(Math.random()-.5)*12})}
 FX.add({step(dt,c){let alive=0;for(const p of ps){p.age+=dt;if(p.age>p.life)continue;alive++;p.vy+=(o.g??600)*dt;const dr=Math.pow(o.drag??.12,dt);p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;
  const k=1-p.age/p.life;c.globalAlpha=Math.min(1,k*1.6);c.fillStyle=p.c;
  if(o.shape==='shard'){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.beginPath();c.moveTo(-p.s,-p.s*.4);c.lineTo(p.s,0);c.lineTo(-p.s*.6,p.s*.5);c.fill();c.restore()}
  else if(o.shape==='fleck'){c.save();c.translate(p.x,p.y);c.rotate(p.r);c.scale(1,Math.cos(p.r*1.7));c.fillRect(-p.s,-p.s*.6,p.s*2,p.s*1.2);c.restore()}
  else{c.beginPath();c.arc(p.x,p.y,p.s*(o.shrink?k:1),0,7);c.fill()}}c.globalAlpha=1;return alive>0}})};

/* frame rate during a moment: every rAF delta while it runs */
let fr=null;P.fpsStart=name=>{const me=fr={name,d:[],last:performance.now(),on:true};const f=t=>{if(fr!==me||!me.on)return;me.d.push(t-me.last);me.last=t;requestAnimationFrame(f)};requestAnimationFrame(f)};
P.fpsStop=()=>{if(!fr)return;fr.on=false;const d=fr.d.slice(1).sort((a,b)=>b-a);if(!d.length)return;const avg=1000/(d.reduce((a,b)=>a+b)/d.length),low=1000/d[Math.max(0,Math.floor(d.length*.01))];
 const r={moment:fr.name,avg:Math.round(avg),low1:Math.round(low),frames:d.length};(window.P2FPS=window.P2FPS||[]).push(r);$('#r-fps').textContent=`${r.moment}: ${r.avg} fps avg, ${r.low1} at 1% low`;fr=null};

/* ---------- the desk ---------- */
function deskHTML(){const place=W.place.replace(/,.*$/,'');
 const led=k=>{const L=W.ledgers[k];return`<div class="led" data-r="${k}" role="button" tabindex="0" aria-label="${L.name}: open resources" style="--c:var(--${RC[k]})">${P.ic(RIC[L.icon]||'i-tre')}<span class="lk">${L.name}</span><b class="n num">${P.S.res[k]}</b><span class="dx"></span></div>`};
 const hm=h=>{const s=P.S.sup[h.id],w=Math.round((h.weight||0)*100);return`<div class="hm" data-h="${h.id}" role="button" tabindex="0" style="--gc:var(--g-${h.id})"><span class="hi">${P.ic(HIC[h.icon]||'i-flag')}</span><span class="hb"><b class="hn">${h.short||h.name}</b><span class="hr"><i class="bar"><i style="width:${s}%"></i><i class="ln" style="left:${h.line}%"></i></i><span class="dx"></span><b class="n num">${s}</b>${w?`<span class="bal-w">${P.ic('i-ballot')}${w}<span class="bal-tip" role="tooltip">${P.balTip(h)}</span></span>`:''}</span><span class="hs"></span></span></div>`};
 const fv=P.fv();
 return`<header class="top sf"><div class="id"><div><b class="dname">${W.title}</b><span class="turn">${V.turn[0].toUpperCase()+V.turn.slice(1)} 1 of 20 · ${W.place}</span></div></div>
 <div class="leds">${RES.map(led).join('')}</div>
 <div id="fv" class="fv ${fv>=50?'over':'under'}"><span class="fk">Final vote</span><b class="n num">${fv}</b><span class="fo">of 100, need 50</span><i class="bar"><i style="width:${fv}%"></i><i class="ln" style="left:50%"></i></i><span class="dx"></span></div></header>
 <aside class="rim rim-l sf"><h4>In ${place}</h4>${HOME.map(hm).join('')}</aside>
 <section class="stage sf" id="stage"><div class="st-h"><span class="kicker">${H.label} · 100 ${H.unit}</span><span class="st-v" id="stv"></span></div>
 <div class="hemi-w"><svg id="hemi" viewBox="-1.08 -1.1 2.16 1.2" preserveAspectRatio="xMidYMid meet" aria-label="${H.label}">
 ${P.seats.map(s=>`<circle class="seat" data-i="${s.i}" cx="${s.x.toFixed(4)}" cy="${s.y.toFixed(4)}" r=".041" data-cl="${s.fac.c[0]}" data-cd="${s.fac.c[1]}" style="--pc:${s.fac.c[P.dark()?1:0]}"/>`).join('')}
 <text class="big" id="hcN" x="0" y="-.06">${H.need}</text><text class="sub" id="hcS" x="0" y=".05">needed of 100</text></svg><div class="st-fx" id="stfx"></div></div>
 <div class="tly" id="tly"><span class="ty-f"><b id="tyF" class="num">0</b> for</span><div class="ty-bar"><i class="f"></i><i class="a"></i><i class="ln" style="left:${H.need}%"></i></div><span class="ty-a"><b id="tyA" class="num">0</b> against</span></div>
 <div class="gleg">${H.fac.map(f=>`<span><i data-cl="${f.c[0]}" data-cd="${f.c[1]}" style="--pc:${f.c[P.dark()?1:0]}"></i>${f.name} <b>${f.n}</b></span>`).join('')}</div></section>
 <aside class="rim rim-r sf"><h4>Beyond ${place}</h4>${ABROAD.map(hm).join('')}</aside>
 <div class="tagw" id="tagw"><div class="tag0 sf" id="tag"><span>${P.ic('i-scroll')} The clerk prices your act here. Nothing lands until you sign it.</span></div></div>
 <div class="cmp"><div class="cbox sf"><span class="vpick">${P.ic(S0.act.icon)}<span>${W.instruments[WID==='westeros'?'force':'law'].name}</span></span><span class="actx">${S0.act.text}</span><button class="btn accent" id="go">${P.ic('i-ballot')}Price it</button></div><button class="btn endt">End ${V.turn} 1</button></div>`}
P.sfx=name=>{/* sound hook: silent placeholder for '${name}' */};
/* each faction's split and its reason, from its card, under the chamber */
P.reasons=()=>{$('.gleg').innerHTML=P.lines().fac.map(f=>`<span><i data-cl="${f.c[0]}" data-cd="${f.c[1]}" style="--pc:${f.c[P.dark()?1:0]}"></i><b>${f.name}</b>&nbsp;${[f.for&&f.for+' for',f.hs&&f.hs+' hesitant',f.ag&&f.ag+' against'].filter(Boolean).join(', ')}: ${f.hs?f.hesWhy:f.why}</span>`).join('')};
/* the count, seat by seat: fixed votes speed up, then each hesitant name is called on its own */

<script>
/* P2 round 2 shared flow, on top of p2-core.js: type the act, sign with the shockwave, the seat-by-seat count, the verdict,
   couriers that carry each change to its target (P1-B), and the review that stays until you move on. Options only price. */
(()=>{const P=P2,{$,$$}=P;
P.WHY={'biden-2021':{now:{authority:'Spent to bring it to a vote'},
  pass:{treasury:'The checks go out',authority:'You delivered your first big bill',congress:'The Senate did its job',public:'Checks in the mail',dem:'Your party delivered',fed:'Fears more inflation',gop:'Spending without cuts',markets:'More borrowing'},
  fail:{authority:'Beaten on the floor',dem:'Your party wasted a vote',public:'No checks this month'}},
 westeros:{now:{authority:'Spent to call the banners'},
  pass:{treasury:'The march is paid for',authority:'The realm answers its king',smallfolk:'Safe roads',council:'Order on the kingsroad',baratheon:'The king rides out',houses:'Their men march for you',ironbank:'More crown spending'},
  fail:{authority:'The lords defied you',baratheon:'Your house is shamed',smallfolk:'The outlaws keep the road'}}}[P.WID];
/* the final vote is a target too: everything the act touches, including what you need to survive */
P.fvItem=out=>{const s={...P.S.sup};for(const it of P.items(out))if(it.kind==='sup')s[it.id]=it.to;const from=P.fv(),to=P.fv(s);
 return{kind:'fv',id:'fv',name:'Final vote',d:to-from,from,to,el:$('#fv'),num:$('#fv .n'),icon:'i-ballot',c:'var(--ink)'}};
P.plan=()=>{const L=P.lines();L.pass.push(P.fvItem('pass'));L.fail.push(P.fvItem('fail'));return L};
P.key=(set,it)=>`${set}:${it.kind}:${it.id}`;
P.colOf=it=>it.d>0?P.css('--up'):P.css(it.kind==='res'&&it.d<0?'--dn':'--danger');

/* the composer takes typing; the demo types the sample act */
P.r2reset=()=>{const a=$('.actx');if(a&&a.tagName!=='INPUT'){a.outerHTML=`<input class="actx" id="actx" aria-label="Your act" placeholder="Type an act, then price it" value="">`}};
P.typeAct=async()=>{const i=$('#actx');if(i.value.trim())return;const t=P.SC.act.text;if(P.rm){i.value=t;return}
 i.focus();for(let k=1;k<=t.length;k+=2){i.value=t.slice(0,k);await P.sleep(16)}i.value=t;i.blur();await P.sleep(220)};

/* ---------- couriers (P1-B): a head, a fading trail, a label; the landing is the change ---------- */
const ease=t=>t<.5?4*t*t*t:1-(-2*t+2)**3/2;
P.fly=({from,to,col,label,r=7,dur=.7,arc=.28,delay=0,coin=false,onLand})=>new Promise(res=>{const land=()=>{onLand?.();res()};if(P.rm){land();return}
 const dx=to.x-from.x,dy=to.y-from.y,d=Math.hypot(dx,dy)||1;let px=-dy/d,py=dx/d;if(py>0){px=-px;py=-py}
 const c={x0:from.x,y0:from.y,x1:to.x,y1:to.y,cx:from.x+dx/2+px*d*arc,cy:from.y+dy/2+py*d*arc},D=dur*P.k,mono=P.css('--mono'),card=P.css('--card');let t=-delay*P.k;
 const bz=q=>{const u=1-q;return[u*u*c.x0+2*u*q*c.cx+q*q*c.x1,u*u*c.y0+2*u*q*c.cy+q*q*c.y1]};
 P.FX.add({step(dt,cx){t+=dt;if(t<0)return true;const p=t/D;if(p>=1){land();return false}
  const e=ease(p),tail=Math.max(0,e-(coin?.12:.22));cx.lineCap='round';
  for(let i=0;i<10;i++){const[ax,ay]=bz(tail+(e-tail)*i/10),[bx,by]=bz(tail+(e-tail)*(i+1)/10);cx.strokeStyle=col;cx.globalAlpha=(i+1)/10*(coin?.35:.55);cx.lineWidth=r*1.3*(i+1)/10;cx.beginPath();cx.moveTo(ax,ay);cx.lineTo(bx,by);cx.stroke()}
  const[hx,hy]=bz(e);cx.globalAlpha=1;cx.fillStyle=col;cx.beginPath();cx.arc(hx,hy,r,0,7);cx.fill();cx.fillStyle='rgba(255,255,255,.55)';cx.beginPath();cx.arc(hx-r*.3,hy-r*.3,r*.38,0,7);cx.fill();
  if(label){cx.font=`700 ${Math.round(15*(+getComputedStyle(document.documentElement).getPropertyValue("--k")||1))}px ${mono}`;const w=cx.measureText(label).width+14,lx=hx+r+5,ly=hy-11.5;cx.fillStyle=card;cx.strokeStyle=col;cx.lineWidth=1.5;cx.beginPath();cx.roundRect(lx,ly,w,23,6);cx.fill();cx.stroke();cx.fillStyle=col;cx.textBaseline='middle';cx.fillText(label,lx+7,ly+12)}}})});
P.ring=(x,y,col,R=34,w=2.5,dur=.52)=>{if(P.rm)return;let t=0;P.FX.add({step(dt,c){t+=dt;const p=t/dur;if(p>=1)return false;const e=1-(1-p)**3;c.globalAlpha=1-p;c.strokeStyle=col;c.lineWidth=w*(1-p)+.5;c.beginPath();c.arc(x,y,6+R*e,0,7);c.stroke();c.globalAlpha=1}})};
/* a why-tag beside the target; it fades, the review keeps it */
function tag(el,d,why,col){const b=el.getBoundingClientRect(),t=document.createElement('div');t.className='wtag';t.style.setProperty('--tc',col);t.innerHTML=`<b class="num">${P.fmt(d)}</b><span>${why}</span>`;
 const right=b.left<innerWidth/2;if(el.classList.contains('hm')){t.style.top=(b.top+6)+'px';if(right)t.style.left=(b.right+12)+'px';else t.style.right=(innerWidth-b.left+12)+'px'}else{t.style.top=(b.bottom+8)+'px';t.style.left=Math.min(innerWidth-250,b.left)+'px'}
 document.body.appendChild(t);if(!P.rm)Motion.animate(t,{opacity:[0,1],scale:[.9,1]},{duration:.25});setTimeout(()=>{if(t.isConnected)Motion.animate(t,{opacity:0},{duration:.4}).then(()=>t.remove())},3200*P.k)}
const gd=(it,col)=>{const s=it.kind==='sup'?$('.dx',it.el):$('.dx',it.el);s.innerHTML=`<span class="gd" style="--c:${col}">${P.fmt(it.d)}</span>`};

/* a resource: coins travel one by one and the counter ticks as each lands (a cost ticks as each leaves) */
async function resource(it,src,log){const col=P.css(it.c.slice(4,-1)),b=P.at($('.n',it.el)),N=Math.min(16,Math.max(1,Math.abs(it.d))),gain=it.d>0,fl=[];P.sfx(gain?'coins-in':'coins-out');
 for(let i=0;i<N;i++){const v=it.from+Math.round(it.d*(i+1)/N),j={x:(Math.random()-.5)*24,y:(Math.random()-.5)*14};if(!gain)it.num.textContent=v;
  fl.push(P.fly({from:gain?{x:src.x+j.x,y:src.y+j.y}:b,to:gain?b:{x:src.x+j.x,y:src.y+j.y},col,r:5,coin:true,dur:.55+Math.random()*.15,arc:.18+Math.random()*.12,delay:i*.045,label:i===N-1?P.fmt(it.d):null,
   onLand:()=>{if(gain){it.num.textContent=v;if(!P.rm)Motion.animate(it.num,{scale:[1.12,1]},{duration:.18})}P.burst(gain?b.x:src.x,gain?b.y:src.y,{n:3,colors:[col],speed:90,g:0,size:1.8,life:.35})}}));
  if(!gain&&!P.rm)await P.sleep(45)}
 await Promise.all(fl);P.O.landed?.(it);P.land(it,0);gd(it,gain?col:P.css('--danger'));if(Math.abs(it.d)>=10)P.ring(b.x,b.y,gain?col:P.css('--danger'),46,3);
 tag(it.el,it.d,log.why,gain?col:P.css('--danger'));log.to=it.to}
function landSup(it,log){const col=it.d>0?P.css('--up'):P.css('--danger'),c=P.at($('.hi',it.el));P.O.landed?.(it);P.land(it,450);gd(it,col);
 it.el.style.setProperty('--fc',col);it.el.classList.remove('flash');void it.el.offsetWidth;it.el.classList.add('flash');
 P.ring(c.x,c.y,col,34,2.5);P.burst(c.x,c.y,{n:8,colors:[col],speed:150,g:0,size:2.2,life:.45,shrink:true});tag(it.el,it.d,log.why,col);P.sfx(it.d>0?'land-up':'land-down')}

/* ---------- SIGN: charge, then the shockwave runs out from the pen and shoves the whole desk ---------- */
const ringDraw=(c,x,y,r,col,a,w)=>{c.globalAlpha=a*.22;c.strokeStyle=col;c.lineWidth=w*3.2;c.beginPath();c.arc(x,y,Math.max(1,r-w),0,7);c.stroke();c.globalAlpha=a;c.lineWidth=w*.5;c.beginPath();c.arc(x,y,r,0,7);c.stroke();c.globalAlpha=1};
function wave(ox,oy,{dur=.9,col,targets=[],hit,w=30}){const R=Math.hypot(Math.max(ox,innerWidth-ox),Math.max(oy,innerHeight-oy)),T=targets.map(el=>{const a=P.at(el);return{el,x:a.x,y:a.y,d:Math.hypot(a.x-ox,a.y-oy)}});
 if(P.rm)return P.sleep(100);return new Promise(res=>{let t=0;P.FX.add({step(dt,c){t+=dt;const p=Math.min(1,t/dur),r=(1-Math.pow(1-p,2.2))*R;ringDraw(c,ox,oy,r,col,1-p*.7,w*(1-p*.5));
  for(const q of T)if(!q.done&&q.d<=r){q.done=true;hit(q,ox,oy)}if(p>=1){res();return false}}})})}
const panels=()=>[$('.top'),$('.rim-l'),$('.rim-r'),$('#stage'),$('#tagw'),$('.cmp')];
async function signWave(){const sg=$('#sign');if(!$('.chg',sg))sg.insertAdjacentHTML('afterbegin','<i class="chg"></i>');
 const dk=$('#dk'),ink=P.css('--ink');let ch=0,on=true;
 P.FX.add({step(dt,c){ch=on?Math.min(1,ch+dt/.75):Math.max(0,ch-dt*3);const g=c.createRadialGradient(innerWidth/2,innerHeight/2,innerHeight*(.62-.2*ch),innerWidth/2,innerHeight/2,innerHeight);g.addColorStop(0,'transparent');g.addColorStop(1,ink);c.globalAlpha=.2*ch;c.fillStyle=g;c.fillRect(0,0,innerWidth,innerHeight);c.globalAlpha=1;return on||ch>0}});
 P.sfx('charge');await P.a($('.chg',sg),{scaleX:[0,1]},{duration:.75*P.k,ease:'easeIn'});on=false;P.sfx('release');
 const o=P.at(sg),acc=P.css('--accent');
 if(!P.rm){let t=0;P.FX.add({step(dt,c){t+=dt;const p=t/.3;if(p>1)return false;c.fillStyle=acc;c.globalAlpha=.14*(1-p);c.fillRect(0,0,innerWidth,innerHeight);c.globalAlpha=1}})}
 P.burst(o.x,o.y,{n:40,colors:[acc,P.css('--navy'),'#e9b949'],speed:800,g:150,drag:.3,size:3,shape:'fleck',life:1});P.shake(8,360);
 const T=[...$$('.led'),$('#fv'),...$$('.hm'),$('.st-h'),$('.hemi-w'),$('.tly'),$('.gleg'),$('.vpick')];
 const w=wave(o.x,o.y,{col:acc,targets:T,hit(q,ox,oy){if(P.rm)return;const dx=q.x-ox,dy=q.y-oy,d=Math.hypot(dx,dy)||1;Motion.animate(q.el,{x:[0,dx/d*12,0],y:[0,dy/d*12,0]},{duration:.5,ease:[.2,.9,.3,1]})}});
 await P.O.commit?.(P);await w}

/* ---------- the count, seat by seat (A) ---------- */
async function count(out){const dk=$('#dk');dk.classList.add('floor');if(!P.rm)Motion.animate($('#stage'),{scale:[1,1.02]},{duration:.6,ease:'easeOut'});
 const fx=$('#stfx');fx.innerHTML='<div class="call" id="call"></div>';P.center(0,`for · ${P.H.need} needed`);P.tally(0,0);
 const R=await P.count(out,{
  onSeat(x,y,n){if(x&&!P.rm)Motion.animate(x.s.el,{scale:[1.7,1]},{duration:.22});P.tally(y,n);$('#hcN').textContent=y},
  async onWho(g){const cl=$('#call');cl.innerHTML=`${P.ic('i-ballot')}<b>${g.who}</b><span>${g.list.length>1?g.list.length+' voices':''}</span>`;
   await P.a(cl,{opacity:[0,1],y:[-10,0]},{duration:.18});g.list.forEach(h=>P.seatCls(h.s,'p-hes'));if(!P.rm)Motion.animate(g.list.map(h=>h.s.el),{scale:[1,1.35,1]},{duration:.45});await P.sleep(520*P.hk)},
  async onWhoDone(g,gy,y,n,R){const cl=$('#call');cl.insertAdjacentHTML('beforeend',`<span class="vv ${gy?'':'no'}">${g.list.length>1?`${gy} of ${g.list.length} for`:gy?'Yes':'No'}</span>`);
   if(!P.rm)Motion.animate(g.list.map(h=>h.s.el),{scale:[2,1]},{type:'spring',stiffness:600,damping:12});P.tally(y,n);$('#hcN').textContent=y;
   if(P.H.veto&&g.fac.id===P.H.veto.fac){const vy=R.hes.filter(h=>h.fac===g.fac&&h.v&&R.hes.indexOf(h)<=R.hes.indexOf(g.list.at(-1))).length;$('#stv').innerHTML=`<span class="vtag">${P.ic('i-lock')}${P.SC.vetoes[0].name}: ${vy} of 30, need ${P.H.veto.need}</span>`}
   P.shake(2.5,160);await P.sleep(520*P.hk);await P.a(cl,{opacity:0},{duration:.12})}});
 if(R.tie){const cl=$('#call');cl.innerHTML=`${P.ic('i-star')}<b>${R.yes} to ${R.no}.</b><span>${P.H.tie} breaks the tie</span>`;await P.a(cl,{opacity:[0,1]},{duration:.2});
  await P.sleep(350);P.shake(5,220,[0,1]);$('#hcN').textContent=R.fy;P.tally(R.fy,R.no);await P.sleep(450);await P.a(cl,{opacity:0},{duration:.15})}
 return R}

/* ---------- the verdict: the chamber answers, then the whole desk stands up (pass) or sinks (fail) ---------- */
async function verdict(R){const pass=R.pass,word=pass?P.V.pass:P.V.fail,dk=$('#dk'),fx=$('#stfx');dk.classList.remove('floor');
 fx.insertAdjacentHTML('beforeend',`<div class="vd ${pass?'':'fail'}" id="vd"><div class="vw" aria-label="${word}">${[...word].map(c=>`<span>${c}</span>`).join('')}</div><span class="vs num">${R.score}${P.H.veto&&!pass?` · ${P.SC.vetoes[0].name.toLowerCase()} said no`:''}</span></div>`);
 $('.hemi-w').classList.add('dim');const vd=$('#vd'),L=$$('.vw span',vd),yes=P.seats.filter(s=>s.el.classList.contains('v-yes'));
 P.sfx(pass?'verdict-pass':'verdict-fail');
 if(pass){/* the yes seats rise in a wave across the chamber */
  yes.sort((a,b)=>b.th-a.th).forEach((s,i)=>{if(!P.rm)Motion.animate(s.el,{scale:[1,1.7,1]},{duration:.36,delay:i*.007})});
  if(!P.rm)Motion.animate($('.ty-bar .ln'),{scaleY:[1,3,1],scaleX:[1,3,1]},{duration:.5})}
 else{/* the lights go out on your side, from the edge inward */
  yes.sort((a,b)=>b.th-a.th).forEach((s,i)=>setTimeout(()=>s.el.classList.add('v-dark'),P.rm?0:i*9))}
 /* the word sets letter by letter; each letter lands with a knock */
 if(P.rm)vd.style.opacity=1;else{vd.style.opacity=1;L.forEach((l,i)=>setTimeout(()=>P.shake(pass?2.5:3.5,90),(i*.05+.2)*1000));
  await P.a(L,{y:[-70,0],scale:[1.9,1],opacity:[0,1]},{duration:.22,delay:Motion.stagger(.05),ease:[.6,0,1,.6]});
  Motion.animate($('.vs',vd),{opacity:[0,1],y:[8,0]},{duration:.25})}
 const st=P.at($('#stage')),ps=panels().map(el=>({el,d:Math.hypot(P.at(el).x-st.x,P.at(el).y-st.y)})).sort((a,b)=>a.d-b.d);
 if(pass){P.shake(9,420);
  /* the desk stands: every panel lifts in a wave out from the chamber; a gold light runs across it; ballot slips rain */
  if(!P.rm){ps.forEach(p=>Motion.animate(p.el,{y:[0,-9,0],scale:[1,1.012,1]},{duration:.75,delay:p.d/1600,ease:[.2,.9,.3,1]}));
   const sw=document.createElement('div');sw.className='sweep';document.body.appendChild(sw);Motion.animate(sw,{x:['-60%','160%']},{duration:1.1,ease:[.4,0,.2,1]}).then(()=>sw.remove());
   const cols=[P.css('--accent'),P.css('--navy'),'#e9b949',P.css('--card')];
   P.burst(0,-10,{n:70,dir:Math.PI*.3,spread:.9,speed:1100,g:520,drag:.35,size:5,shape:'fleck',life:2.4,colors:cols});P.burst(innerWidth,-10,{n:70,dir:Math.PI*.7,spread:.9,speed:1100,g:520,drag:.35,size:5,shape:'fleck',life:2.4,colors:cols})}}
 else{P.shake(15,520,[0,1]);
  /* the desk sinks: panels drop in a wave, colour drains, the edges go cold; the last letters of the word slump */

<script>
(()=>{const P=P2,{$,$$}=P;
const cls=it=>it.d>0?'up':'dn';
let ropes=[],simOn=false;
function receipt(L){const c=L.count,v=L.vetoes[0],pn=P.V.pass==='passed'?'passes':'is '+P.V.pass,fn=P.V.fail==='failed'?'fails':'is '+P.V.fail;
 const ln=(k,cl,name,val,tie)=>`<div class="rl ${cl}" ${k?`data-k="${k}"`:''} ${tie?'data-tie="1"':''}><span class="nm">${name}</span><span class="ld"></span><b>${val}</b>${tie?'<i class="kn"></i>':''}</div>`;
 const it=(set,i,tie)=>ln(P.key(set,i),set==='pass'?cls(i):'bad',i.name,P.fmt(i.d),tie);
 return`<div class="rc" id="pb"><div class="head"><i></i><i></i><span>The clerk's receipt · ${P.SC.act.title}</span></div>
 <div class="stub"><div class="paper"><h5>Spent when you sign</h5>${L.now.map(i=>it('now',i)).join('')}<h5>Must agree</h5>${ln('veto','',v.name,P.H.veto?P.H.veto.need+' of 30':P.H.need+' of 100',true)}</div></div>
 <div class="stub"><div class="paper"><h5>If it ${pn}</h5>${L.pass.filter(i=>i.kind!=='sup').map(i=>it('pass',i,true)).join('')}<h5>The chamber, need ${c.need}</h5>${ln('ch','',`${c.for} for, ${c.hes} hesitant`,`${c.ag} against`,true)}</div></div>
 <div class="stub"><div class="paper"><h5>Support, if it ${pn}</h5>${L.pass.filter(i=>i.kind==='sup').map(i=>it('pass',i,true)).join('')}</div></div>
 <div class="stub"><div class="paper"><h5>If it ${fn}</h5>${L.fail.map(i=>it('fail',i)).join('')}</div></div>
 <div class="acts"><button class="btn accent" id="sign">${P.ic('i-pen')}Sign it</button><button class="btn" id="tear">Tear up</button></div></div>`}

/* threads: verlet ropes with slack; the far end is carried to the target, then everything settles and sways */
function sim(){if(simOn||P.rm)return;simOn=true;const st=$('#stage').getBoundingClientRect();
 P.FX.add({step(dt,c){if(!ropes.length){simOn=false;return false}const h=1/60;
  for(const r of ropes){r.t+=dt;const n=r.pts.length-1;let ex=r.b.x,ey=r.b.y;
   if(!r.pinB){const q=Math.min(1,r.t/.42),e=1-Math.pow(1-q,3);ex=r.a.x+(r.b.x-r.a.x)*e;ey=r.a.y+(r.b.y-r.a.y)*e-90*Math.sin(Math.PI*e);if(q>=1){r.pinB=true;r.onPin?.()}}
   for(let i=0;i<=n;i++){const p=r.pts[i];if((i===0&&r.pinA)||i===n)continue;const vx=(p.x-p.px)*.985,vy=(p.y-p.py)*.985;p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+900*h*h}
   for(let k=0;k<6;k++){if(r.pinA){r.pts[0].x=r.a.x;r.pts[0].y=r.a.y}r.pts[n].x=ex;r.pts[n].y=ey;
    for(let i=0;i<n;i++){const p=r.pts[i],q=r.pts[i+1],dx=q.x-p.x,dy=q.y-p.y,d=Math.hypot(dx,dy)||1e-4,df=(d-r.len)/d*.5;
     const pa=(i===0&&r.pinA)?0:1,pb=(i+1===n)?0:1,s=pa+pb||1;p.x+=dx*df*pa*2/s;p.y+=dy*df*pa*2/s;q.x-=dx*df*pb*2/s;q.y-=dy*df*pb*2/s}}
   if(r.fade)r.alpha-=dt*1.1}
  ropes=ropes.filter(r=>r.alpha>0);
  c.save();c.beginPath();c.rect(0,0,innerWidth,innerHeight);c.roundRect(st.left,st.top,st.width,st.height,12);c.clip('evenodd');c.lineCap='round';c.lineJoin='round';
  for(const r of ropes){const p=r.pts;c.strokeStyle=r.col;c.globalAlpha=.8*r.alpha;c.lineWidth=1.8;c.beginPath();c.moveTo(p[0].x,p[0].y);
   for(let i=1;i<p.length-1;i++){const mx=(p[i].x+p[i+1].x)/2,my=(p[i].y+p[i+1].y)/2;c.quadraticCurveTo(p[i].x,p[i].y,mx,my)}c.lineTo(p.at(-1).x,p.at(-1).y);c.stroke()}
  c.restore();c.globalAlpha=1;return true}})}
function thread(a,b,col,onPin){setTimeout(()=>onPin?.(),P.rm?0:220);return;if(P.rm){onPin?.();return}const n=14,pts=[];for(let i=0;i<=n;i++)pts.push({x:a.x,y:a.y,px:a.x,py:a.y});
 ropes.push({pts,a,b,col,len:Math.hypot(b.x-a.x,b.y-a.y)*1.08/n,pinA:true,pinB:false,t:0,alpha:1,onPin});sim()}
const knot=(it)=>{const d=$('.dx',it.el);d.innerHTML=`<span class="knot ${cls(it)}">${P.fmt(it.d)}</span>`;if(!P.rm){Motion.animate(d.firstChild,{scale:[1.6,1]},{type:'spring',stiffness:600,damping:12});Motion.animate(it.el,{x:[0,4,-3,0]},{duration:.3})}P.sfx('knot')};

async function price(P){await P.typeAct();P.fpsStart('pricing');P.sfx('printer');
 await P.a($('#go'),{scale:[1,.94,1]},{duration:.18});
 const L=P.plan();$('#tag').outerHTML=receipt(L);const pb=$('#pb'),head=$('.head',pb);$('#go').disabled=true;
 if(!P.rm)await P.a(head,{y:[-18,0],opacity:[0,1]},{duration:.22});
 const papers=$$('.paper',pb),rows=papers.map(p=>[...p.children]),max=Math.max(...rows.map(r=>r.length)),by=new Map(L.pass.map(i=>[P.key('pass',i),i]));
 const c=L.count,v=L.vetoes[0],st=$('.st-h');let led=0;
 /* the printer steps: every stub feeds one more line; a finished line with a knot throws its thread */
 for(let k=1;k<=max;k++){$$('.head i',pb).forEach((e,i)=>e.classList.toggle('on',(k+i)%2===0));
  papers.forEach((p,j)=>{const r=rows[j];if(k>r.length)return;const el=r[k-1],bottom=el.offsetTop+el.offsetHeight+(k===r.length?14:0);p.style.clipPath=`inset(0 0 calc(100% - ${bottom}px) 0)`;
   if(!P.rm)Motion.animate(p,{y:[-2,0]},{duration:.08});
   if(el.dataset.tie){const kn=P.at($('.kn',el)),key=el.dataset.k,it=by.get(key);
    if(it)thread(kn,it.kind==='sup'?P.at($('.hi',it.el)):P.at(it.num),P.css(it.d>0?'--up':'--dn'),()=>knot(it));
    else if(key==='ch'){const s=P.at(st);thread(kn,{x:s.x,y:s.b.bottom-4},P.css('--ink'),()=>{$('#stv').innerHTML=`<span class="ctel">${P.ic('i-ballot')}<b>${c.for}</b> for · <b>${c.hes}</b> hesitant · <b>${c.ag}</b> against</span>`;
      P.seats.forEach(s=>{const d=(Math.PI-s.th)/Math.PI*.4;if(P.rm){P.seatCls(s,'p-'+s.pre);return}setTimeout(()=>P.seatCls(s,'p-'+s.pre),d*1000);Motion.animate(s.el,{scaleX:[1,0,1]},{duration:.22,delay:d})});
      P.center(c.for,`for · ${c.need} needed`);P.tally(c.for,c.ag);P.reasons()})}
    else if(key==='veto')thread(kn,P.at($('.hi',v.el)),P.css('--accent'),()=>{$('.hi',v.el).insertAdjacentHTML('beforeend',`<i class="lockb">${P.ic('i-lock')}</i>`);if(!P.rm)Motion.animate($('.lockb',v.el),{scale:[0,1.4,1]},{duration:.35})})}});
  P.sfx('feed');await P.sleep(P.rm?0:95)}
 papers.forEach(p=>p.style.clipPath='none');$$('.head i',pb).forEach(e=>e.classList.remove('on'));
 await P.sleep(1100);P.fpsStop()}
P.boot({id:'desk',name:'The desk',price,sign:(P,o)=>P.signFlow(P,o),
 reset(){ropes=[];simOn=false;P.r2reset();P.deskReset?.()},
 /* the shockwave cuts every thread at the receipt: they drop and hang from what they hold, then fade */
 commit(){ropes.forEach(r=>{r.pinA=false;r.pinB=true});setTimeout(()=>ropes.forEach(r=>r.fade=true),900)},
 landed(it){},
 drop(){$$('.knot').forEach((e,i)=>P.rm?e.remove():Motion.animate(e,{y:[0,28],opacity:[1,0],rotate:[0,i%2?25:-25]},{duration:.45,delay:i*.03}).then(()=>e.remove()));return P.sleep(500)},
 clear(){$$('.lockb,#stv .ctel').forEach(e=>e.remove())}})})();
</script>
<script>
/* ---------- the desk's own parts: rim rows (one tint), the glance file (R36), the resources sheet ---------- */
(()=>{const P=P2,{$,$$}=P;
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* a spring as a native easing: simulate once, hand WAAPI a linear() curve (runs on the compositor) */
function spring(k=170,c=18){let x=0,v=0,t=0;const dt=1/240,pts=[0];
 while(t<2.5){const a=-k*(x-1)-c*v;v+=a*dt;x+=v*dt;t+=dt;if(Math.round(t*240)%4===0)pts.push(+x.toFixed(4));if(t>.25&&Math.abs(x-1)<.002&&Math.abs(v)<.02)break}
 pts.push(1);return{easing:`linear(${pts.join(',')})`,duration:Math.round(t*1000)}}
/* frame meter for the desk's own moments, same record as the flow's (window.P2FPS) */
function meter(name,ms){let last=performance.now();const d=[],end=last+ms;const f=t=>{d.push(t-last);last=t;if(t<end)return requestAnimationFrame(f);
 const s=d.slice(1).sort((a,b)=>b-a);if(!s.length)return;(window.P2FPS=window.P2FPS||[]).push({moment:name,avg:Math.round(1000/(s.reduce((a,b)=>a+b)/s.length)),low1:Math.round(1000/s[Math.floor(s.length*.01)]),frames:s.length})};requestAnimationFrame(f)}

/* one hue per group: the chamber's faction colours where a group sits in it, so a rim row matches its seats */
const GC={'biden-2021':{congress:['#1f3a6e','#8eaaf0'],court:['#4f5668','#aab1c2'],fed:['#227f53','#6dc393'],public:['#8a6d24','#f1cc7e'],dem:['#2553a3','#7aa2ff'],gop:['#bf2f2b','#ff7a70'],nato:['#1d6470','#6cc4cf'],china:['#a14a1a','#f0a070'],markets:['#623e96','#a37fde']},
 westeros:{houses:['#44584c','#a9c2b0'],lannister:['#9b2226','#ff8a80'],council:['#3f5163','#9fb4c8'],baratheon:['#7a5d0e','#e3c15a'],smallfolk:['#6b4f33','#caa27a'],faith:['#2f4a6e','#9db6e0'],ironbank:['#4a4f57','#b5bcc7'],exiles:['#6d2d5e','#d99ac7'],freecities:['#1d6470','#6cc4cf']}};
/* the glance file's words (R36): 2 to 3 wants, 2 to 3 hates with the last one the red line, and what it does when it strikes. Written for the mock; in the game they are the engine's match tags */
const G2={
'biden-2021':{

 court:[['Orders citing a law','Power to the states','Nine justices'],['Federal mandates','Court packing','Defying its rulings'],'Strikes down your orders'],
 fed:[['Stable prices','Powell renamed','Clear ports'],['More stimulus','New tariffs','Orders on rates'],'Raises rates hard'],
 nato:[['Eastern flank troops','Arms for Ukraine','Being consulted'],['Deals over Kyiv','Going it alone','Doubting Article 5'],'Pulls back from your plans'],
 public:[['Relief checks','Open schools','Jobs'],['Gas taxes','New lockdowns','Troops on protesters'],'Takes to the streets'],
 china:[['Tariffs lifted','Huawei eased','One China'],['Chip bans','Arms for Taiwan','Recognising Taiwan'],'Cuts off chips and rare earths'],
 dem:[['The rescue plan','Climate money','Voting rights'],['Smaller relief','The filibuster','Social Security cuts'],'Calls the final vote early'],
 gop:[['Spending cuts','The border wall','2017 tax cuts'],['New spending','Tax rises','Federal election law'],'Shuts the government down'],
 markets:[['A budget that adds up','Debt ceiling raised'],['Unfunded trillions','Shutdowns','A missed payment'],'Sells your bonds']},
westeros:{
 houses:[['Their own justice','Asked before war','Peace between houses'],['Royal judges','Calling the banners','Seizing a castle'],'Rises against the throne'],
 lannister:[['Tywin as Hand','Repaid first','Joffrey as heir'],['Stark as Hand','Iron Bank first','Setting Cersei aside'],'Keeps its men and gold home'],
 council:[['A Hand to work with','Fewer tourneys','Decrees in council'],['Tourneys on credit','Dismissing the council'],'Lets the realm stall'],
 baratheon:[['Honours for Stannis','Land for storm lords','Targaryens hunted'],['A Lannister Hand','Pardoning the Targaryens'],'Keeps the storm lords home'],
 smallfolk:[['Cheap bread','Peace','Safe roads'],['Bread taxes','Tourneys','Burning the fields'],"Riots in King's Landing"],
 faith:[['Its own courts','Gifts to the Sept'],['Taxing the Faith','Setting the queen aside','Seizing sept lands'],'Turns your house against you'],
 ironbank:[['Payments on time','A sound master of coin'],['Late payments','Tourneys on credit','Refusing to repay'],"Calls in the crown's loans"],
 exiles:[['Loyalists pardoned','Dorne angry'],['Killers sent','A royal fleet','A price on their heads'],'Buys a Dothraki army'],
 freecities:[['Open ports','Quiet seas','Pentos left alone'],['Harbour taxes','A fleet sent east','Seizing their ships'],'Shuts its ports to you']}};

const hold=id=>P.W.holders.find(h=>h.id===id);
const votes=h=>Math.round((h.weight||0)*100);
const stand=(h,s,short)=>{const m=s-h.line;return m<0?`${-m} under${short?'':' its line'} · strikes in 2 ${P.V.turn}s`:m?`${m} above its line`:'On its line'};

/* ---------- rim rows ---------- */
P.balTip=h=>`Votes on you at ${P.V.test}: ${votes(h)} of 100`;
P.rowPaint=id=>{const el=$(`.hm[data-h="${id}"]`);if(!el)return;const h=hold(id),s=P.S.sup[id],m=s-h.line;
 el.style.setProperty('--heat',Math.max(0,Math.min(1,1-m/25)).toFixed(2));el.classList.toggle('warn',m<0);
 $('.hs',el).textContent=stand(h,s,1);
 el.setAttribute('aria-label',`${h.short||h.name}: support ${s}, ${stand(h,s)}${h.weight?`. ${P.balTip(h)}`:''}. Open the ${P.V.file||'file'}.`)};
/* colour tokens fitted to this world's surfaces (4.6:1 on paper, card, tone and the deepest rim wash), then one hue per group */
const hx=c=>{c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.slice(i,i+2),16))},mixc=(a,b,p)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*p).toString(16).padStart(2,'0')).join('');
const lum=c=>{const v=hx(c).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*v[0]+.7152*v[1]+.0722*v[2]};
const cr=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const fit=(fg,bgs,to)=>{for(let p=0;p<=1.001;p+=.04){const c=mixc(fg,to,p);if(bgs.every(b=>cr(c,b)>=4.6))return c}return to};
const TOK=[{tre:'#227f53',aut:'#623e96',che:'#8a6d24',danger:'#bb0916',up:'#1d7a4a',dn:'#c2410c'},{tre:'#6dc393',aut:'#a37fde',che:'#f1cc7e',danger:'#ff7b72',up:'#6dc393',dn:'#ff9d5c'}];
let gcDone=false;
function groupColours(){if(gcDone)return;gcDone=true;const c=GC[P.WID]||{},t=P.W.theme,d=t.dark||{};
 const mode=i=>{const s=i?{paper:d.paper,card:d.surface,ink:d.ink}:{paper:t.paper,card:t.surface,ink:t.ink},bg=[s.paper,s.card,mixc(s.ink,s.paper,i?.9:.92)],wash=Object.values(c).map(x=>mixc(s.card,x[i],.16));
  return[...Object.entries(TOK[i]).map(([k,v])=>`--${k}:${fit(v,k==='danger'?[...bg,...wash]:bg,i?'#ffffff':'#000000')}`),...Object.entries(c).map(([id,x])=>`--g-${id}:${x[i]}`)].join(';')};
 document.head.insertAdjacentHTML('beforeend',`<style>:root{${mode(0)}}:root[data-theme=dark]{${mode(1)}}</style>`);
 document.documentElement.style.setProperty('--fs',(t.bodySize||17)+'px')}
P.deskReset=()=>{groupColours();closeFile(true);closeSheet(true);for(const k in RS)delete RS[k];P.W.holders.forEach(h=>P.rowPaint(h.id))};

/* ---------- the glance file (R36), opened from a rim row ---------- */
let card=null,cardFor=null;
function fileData(id){const h=hold(id),f=h.card?.face,s=P.S.sup[id],[wants,hates,strike]=G2[P.WID]?.[id]||[[],[],h.does||''];
 return{id,h,s,m:s-h.line,wants,hates,strike,face:f?.name||'',role:(f?.role||'').split(';')[0],icon:P.HIC[h.icon]||'i-flag',
  kick:`${P.V.file||'File'} · ${h.where==='home'?'At home':cap(P.V.abroad||'abroad')}`,votes:h.weight?`${votes(h)} of 100 votes on you`:'No vote on you'}}
function fileHTML(d){const tg=(x,c,i)=>`<li class="tg ${c}">${P.ic(i)}<span>${E(x)}</span></li>`,red=d.hates.at(-1);
 return`<header class="fc-h"><span class="fc-i">${P.ic(d.icon)}</span><div class="fc-hd"><p class="fc-k">${E(d.kick)}</p><h2 id="fc-n">${E(d.h.name)}</h2>${d.face?`<p class="fc-r"><b>${E(d.face)}</b>, ${E(d.role)}</p>`:''}</div><button class="fc-x" aria-label="Close the file">${P.ic('i-x')}</button></header>
<div class="fc-b"><div class="fc-s st"><b class="fc-num num">${d.s}</b><div class="fc-m"><span class="fc-bar"><i style="transform:scaleX(${d.s/100})"></i><em style="left:${d.h.line}%"><span class="num">line ${d.h.line}</span></em></span><p class="fc-st">${E(stand(d.h,d.s))} · ${E(d.votes)}</p></div></div>
<div class="fc-t w st"><h3>Wants</h3><ul>${d.wants.map(x=>tg(x,'tw','i-check')).join('')}</ul></div>
<div class="fc-t h st"><h3>Hates</h3><ul>${d.hates.slice(0,-1).map(x=>tg(x,'th','i-x')).join('')}<li class="tg red">${P.ic('i-flame')}<span>${E(red)}</span><small>Red line</small></li></ul></div>
<p class="fc-if st">${P.ic('i-bolt')}<span><b>If it strikes:</b> ${E(d.strike)}</span></p></div>`}
const scrim=id=>{let s=$('#'+id);if(!s){document.body.insertAdjacentHTML('beforeend',`<div class="scrim" id="${id}"></div>`);s=$('#'+id);if(!P.rm)s.animate([{opacity:0},{opacity:1}],{duration:220})}return s};
const unscrim=(id,now)=>{const s=$('#'+id);if(!s)return;s.id='';if(now||P.rm)return s.remove();s.animate([{opacity:1},{opacity:0}],{duration:220,fill:'forwards'}).finished.then(()=>s.remove())};
const flyFrom=(a,b)=>`translate(${a.left+a.width/2-(b.left+b.width/2)}px,${a.top+a.height/2-(b.top+b.height/2)}px) scale(${Math.max(.15,a.height/b.height).toFixed(3)})`;
function openFile(id){const row=$(`.hm[data-h="${id}"]`),d=fileData(id),old=card;closeSheet(true);scrim('fscrim');
 card=document.createElement('article');card.className='fcard'+(d.m<0?' dn':'');card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-labelledby','fc-n');
 card.style.setProperty('--gc',`var(--g-${id})`);card.innerHTML=fileHTML(d);
 const st=$('#stage').getBoundingClientRect();card.style.left=(st.left+st.width/2)+'px';card.style.top=(st.top+st.height/2)+'px';
 document.body.appendChild(card);old?.remove();cardFor=id;$$('.hm.on').forEach(r=>r.classList.remove('on'));row?.classList.add('on');$('.fc-x',card).focus({preventScroll:true});
 if(P.rm||!row)return;meter('open a file',1300);
 const sp=spring(230,24);card.animate([{transform:flyFrom(row.getBoundingClientRect(),card.getBoundingClientRect()),opacity:0},{opacity:1,offset:.3},{transform:'none',opacity:1}],sp);
 $$('.st',card).forEach((x,i)=>x.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:320,delay:140+i*55,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'}));
 $('.fc-bar i',card).animate([{transform:'scaleX(0)'},{transform:`scaleX(${d.s/100})`}],{duration:700,delay:220,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
 $('.red',card).animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}],{duration:420,delay:760,easing:'ease-out'})}
function closeFile(now){if(!card)return;const c=card,row=$(`.hm[data-h="${cardFor}"]`);card=null;cardFor=null;$$('.hm.on').forEach(r=>r.classList.remove('on'));unscrim('fscrim',now);
 if(!now)row?.focus({preventScroll:true});
 if(now||P.rm||!row)return c.remove();meter('close a file',400);
 c.animate([{transform:'none',opacity:1},{transform:flyFrom(row.getBoundingClientRect(),c.getBoundingClientRect()),opacity:0}],{duration:260,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'}).finished.then(()=>c.remove())}

/* ---------- the resources sheet: three stat cards (P3 round 1 A), ticks every 5, the cause lights on a change (round 2) ---------- */
const RS={};
const walk=(end,seed,n=7,amp=14)=>{const R=rng(seed),a=[end];let v=end;for(let i=1;i<n;i++){v=Math.max(0,Math.min(100,Math.round(v-(R()-.42)*amp)));a.unshift(v)}return a};
const resOf=()=>['treasury','authority','chest'].map(k=>{const L=P.W.ledgers[k],v=P.S.res[k];RS[k]=RS[k]||walk(v,hash(P.WID+k));
 return{k,c:P.RC[k],name:L.name,icon:P.RIC[L.icon]||'i-tre',v,hist:RS[k],earn:L.earn||[],spend:L.spend||[],fails:L.fails||''}});
const fmt=d=>P.fmt(d);
function rkHTML(r){const d=r.hist.at(-1)-r.hist[0],mx=Math.max(...r.hist,10),T=P.V.turn;
 return`<article class="rk${r.v===0?' z':''}" data-k="${r.k}" style="--c:var(--${r.c})">
<div class="rk-h"><span class="gem">${P.ic(r.icon)}</span><h3>${E(r.name)}</h3><span class="dlt num"></span><b class="num">${r.v}</b></div>
<div class="rk-m"><div><div class="pips" aria-hidden="true">${Array.from({length:20},(_,i)=>`<i class="${i<Math.round(r.v/5)?'on':''}"></i>`).join('')}</div><div class="pk num"><span>0</span><span>50</span><span>100</span></div></div>
<div><div class="tr" aria-label="The last seven ${E(T)}s: ${r.hist.join(', ')}">${r.hist.map(v=>`<i style="--h:${Math.max(4,v/mx*100)}"></i>`).join('')}</div><div class="trc">7 ${E(T)}s <b class="num">${fmt(d)||'±0'}</b></div></div></div>
<div class="rk-g"><div class="in"><h4>${P.ic('i-arrow')}Fills it</h4><ul>${r.earn.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div><div class="out"><h4>${P.ic('i-lose')}Drains it</h4><ul>${r.spend.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div></div>
<p class="zero"><b>At 0</b><span>${E(cap(r.fails))}</span></p></article>`}
let sheet=null;
function openSheet(){if(sheet)return;closeFile(true);scrim('rscrim');
 sheet=document.createElement('section');sheet.className='rsheet';sheet.setAttribute('role','dialog');sheet.setAttribute('aria-modal','true');sheet.setAttribute('aria-label','Resources');
 sheet.innerHTML=`<header class="rs-h"><h2>Resources</h2><button class="fc-x" id="rs-x" aria-label="Close resources">${P.ic('i-x')}</button></header><div class="rks">${resOf().map(rkHTML).join('')}</div>`;
 document.body.appendChild(sheet);$('#rs-x').focus({preventScroll:true});
 const ks=$('.rks',sheet),over=()=>$$('.rk',ks).some(g=>g.scrollHeight>g.clientHeight+1);for(const k of['f1','f2','f3','f4']){if(!over())break;ks.classList.add(k)}
 if(P.rm)return;meter('open resources',1500);
 sheet.animate([{transform:'translateX(105%)'},{transform:'none'}],spring(210,24));
 $$('.rk',sheet).forEach((k,i)=>{const r=resOf()[i],n=$('.rk-h b',k),pips=$$('.pips i',k),on=Math.round(r.v/5);
  k.animate([{transform:'translateX(60px)',opacity:0},{transform:'none',opacity:1}],{duration:420,delay:120+i*90,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'});
  pips.forEach((p,j)=>{p.classList.remove('on');p.style.setProperty('--d',j)});
  setTimeout(()=>{pips.forEach((p,j)=>p.classList.toggle('on',j<on));P.roll(n,0,r.v,on*28+200)},260+i*90);
  $$('.tr i',k).forEach((b,j)=>b.animate([{transform:'scaleY(0)'},{transform:'none'}],{duration:480,delay:380+i*90+j*40,easing:'cubic-bezier(.22,1,.36,1)',fill:'backwards'}))})}
function closeSheet(now){if(!sheet)return;const s=sheet;sheet=null;unscrim('rscrim',now);if(now||P.rm)return s.remove();
 s.animate([{transform:'none'},{transform:'translateX(105%)'}],{duration:280,easing:'cubic-bezier(.5,0,.75,0)',fill:'forwards'}).finished.then(()=>s.remove())}
/* a resource lands: today's bar takes the new value; an open sheet counts, cascades its pips and lights the column that caused it */
P.resPaint=it=>{const R=RS[it.id];if(R)R[R.length-1]=it.to;if(!sheet)return;const k=$(`.rk[data-k="${it.id}"]`,sheet);if(!k)return;
 const d=it.to-it.from,was=Math.round(it.from/5),now=Math.round(it.to/5),pips=$$('.pips i',k);k.classList.toggle('z',it.to===0);
 const tr=$('.tr',k),mx=Math.max(...R,10);$$('i',tr).forEach((b,j)=>b.style.setProperty('--h',Math.max(4,R[j]/mx*100)));$('.trc b',k).textContent=fmt(R.at(-1)-R[0])||'±0';
 pips.forEach((p,j)=>p.style.setProperty('--d',d>=0?Math.max(0,j-was):Math.max(0,was-1-j)));pips.forEach((p,j)=>p.classList.toggle('on',j<now));
 P.roll($('.rk-h b',k),it.from,it.to,P.rm?0:200+Math.abs(now-was)*28);if(!d)return;
 const dl=$('.rk-h .dlt',k);dl.textContent=fmt(d);dl.className='dlt num '+(d>0?'up':'dn');const col=$(d>0?'.in':'.out',k);
 if(P.rm){dl.style.opacity=1;col.classList.add('lit');return}
 dl.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none',offset:.15},{opacity:1,offset:.8},{opacity:0}],{duration:2200});
 col.animate([{backgroundColor:'transparent'},{backgroundColor:`color-mix(in srgb,var(--${d>0?'up':'danger'}) 16%,transparent)`,offset:.2},{backgroundColor:'transparent'}],{duration:1600,easing:'ease-out'});
 k.animate(d<0?[{transform:'none'},{transform:'translateX(-6px)'},{transform:'translateX(4px)'},{transform:'none'}]:[{transform:'none'},{transform:'translateY(-4px) scale(1.012)'},{transform:'none'}],{duration:380})};

/* ---------- wiring: a row opens its file, a ledger opens the sheet; Esc or the scrim closes ---------- */
document.addEventListener('click',e=>{if(e.target.closest('#rev'))return;
 const row=e.target.closest('.hm[data-h]');if(row)return openFile(row.dataset.h);
 if(e.target.closest('.led'))return openSheet();
 if(e.target.closest('.fc-x,#fscrim'))return e.target.closest('#rs-x')?closeSheet():closeFile();
 if(e.target.closest('#rscrim'))closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(card)closeFile();else closeSheet();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('.hm[data-h],.led')){e.preventDefault();e.target.click()}});
})();
</script>
<script>
/* the desk is drawn for 1440x900; --k grows every size with the screen, so 16:9 and 16:10 edges are used */
(()=>{const B={on:[1440,900],off:null},Q=new URLSearchParams(location.search);let m=Q.get('fit')||'on';
 const set=()=>{const b=B[m];const k=b?Math.min(1.8,Math.max(1,Math.min(innerWidth/b[0],innerHeight/b[1]))):1;
  document.documentElement.style.setProperty('--k',k.toFixed(4));const t=document.getElementById('r-fit');if(t)t.textContent='Fit: '+m};
 addEventListener('resize',set);set();
 addEventListener('click',e=>{if(e.target.id!=='r-fit')return;m={on:'off',off:'on'}[m];const u=new URL(location);u.searchParams.set('fit',m);history.replaceState(null,'',u);set();dispatchEvent(new Event('resize'))});
})();
</script>
